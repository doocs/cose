name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-submission-status:
    if: github.repository == 'doocs/cose' && github.ref == 'refs/heads/verify/edge-submit-268'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the existing Edge submission
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID || vars.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID || vars.EDGE_PRODUCT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as delay } from 'node:timers/promises'
          const id = 'c07f873f-eee0-4e9c-a2eb-7c79d9a26a9c'
          const { EDGE_API_KEY, EDGE_CLIENT_ID, EDGE_PRODUCT_ID } = process.env
          const endpoint = 'https://api.addons.microsoftedge.microsoft.com/v1/products/'
          const url = endpoint + encodeURIComponent(EDGE_PRODUCT_ID) + '/submissions/operations/' + id
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(url, {
              headers: { Authorization: 'ApiKey ' + EDGE_API_KEY, 'X-ClientID': EDGE_CLIENT_ID },
              redirect: 'error',
              signal: AbortSignal.timeout(10_000),
            })
            if (!response.ok) throw new Error('Edge status HTTP ' + response.status)
            const { status, errorCode, message } = await response.json()
            console.log('Edge submission state:', status, errorCode || '')
            if (status === 'Succeeded') {
              const submissionId = /submission with ID ([a-f\d-]+)/i.exec(message)?.[1]
              if (submissionId) console.log('Edge certification submission ID:', submissionId)
              break
            }
            if (status !== 'InProgress') throw new Error('Edge submission failed')
            if (attempt < 5) await delay(4000)
          }
          JS
