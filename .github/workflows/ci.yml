name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  submit-edge-addons:
    if: github.repository == 'doocs/cose' && github.ref == 'refs/heads/verify/edge-submit-268'
    concurrency:
      group: edge-addons
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: cose-extensions
          path: packages
          run-id: 42371361219
          github-token: ${{ github.token }}
      - name: Verify the tested Chromium artifact
        run: |
          unzip -tq packages/cose-1.3.8-chromium.zip
          unzip -p packages/cose-1.3.8-chromium.zip manifest.json |
            jq -e '.version == "1.3.8" and .background.service_worker == "bundles/background.js"'
      - name: Submit the tested Chromium ZIP to Edge Add-ons
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          RELEASE_TAG: v1.3.8
        run: node scripts/submit-edge-addons.mjs
