name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full commit SHA from main to publish or resume after Mozilla approval
        type: string
        required: false

# Fork PRs receive a read-only GITHUB_TOKEN; no repository secrets required.
permissions:
  contents: read

concurrency:
  # Every main push must get a chance to publish its version bump.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit != '' && '0' || '1' }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Read extension version and decide whether to release
        id: version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          REF_DELETED: ${{ github.event.deleted }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$RELEASE_COMMIT" ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
                ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD; then
              echo "::error::Specify the full SHA of a commit on main and run this workflow from main"
              exit 1
            fi
            git checkout --detach "$RELEASE_COMMIT"
          fi
          version=$(node -p "require('./apps/extension/package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$RELEASE_COMMIT" ]]; then
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2,3}$ ]]; then
              echo "::error::Invalid extension version $version"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" != push || "$REF_DELETED" == true ]]; then
            exit 0
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match extension version $version"
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main && -n "$PREVIOUS_SHA" && ! "$PREVIOUS_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            previous=$(git show "$PREVIOUS_SHA:apps/extension/package.json" | jq -er '.version')
            [[ "$version" != "$previous" ]] || exit 0
            if ! node --input-type=module - "$previous" "$version" <<'JS'
          const versions = process.argv.slice(2).map(version => {
            if (!/^(0|[1-9]\d*)(\.(0|[1-9]\d*)){2,3}$/.test(version)) process.exit(1)
            const parts = version.split('.').map(Number)
            if (parts.some(part => part > 65535)) process.exit(1)
            return Array.from({ length: 4 }, (_, index) => String(parts[index] ?? 0).padStart(5, '0')).join('')
          })
          if (versions[1] <= versions[0]) process.exit(1)
          JS
            then
              echo "::error::Extension version must increase from $previous to a valid version"
              exit 1
            fi
          else
            exit 0
          fi
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build and package Chromium
        working-directory: apps/extension
        run: |
          pnpm run build:release
          test -s dist/popup.html
          test -s dist/offscreen.html
          pnpm exec web-ext build --source-dir dist --artifacts-dir "$RUNNER_TEMP/packages" --filename "cose-$VERSION-chromium.zip"

      - name: Load the packaged extension in Chromium
        run: |
          unzip -q "$RUNNER_TEMP/packages/cose-$VERSION-chromium.zip" -d "$RUNNER_TEMP/chromium-extension"
          jq -e --arg version "$VERSION" '.version == $version and .background.service_worker == "bundles/background.js"' "$RUNNER_TEMP/chromium-extension/manifest.json"
          pnpm exec playwright-core install --with-deps --no-shell chromium
          pnpm smoke:chromium "$RUNNER_TEMP/chromium-extension"

      - name: Build, lint and package Firefox
        working-directory: apps/extension
        run: |
          pnpm run build:release --target firefox
          pnpm exec web-ext build --source-dir dist --artifacts-dir "$RUNNER_TEMP/packages" --filename "cose-$VERSION-firefox.zip"
          unzip -p "$RUNNER_TEMP/packages/cose-$VERSION-firefox.zip" manifest.json |
            jq -e --arg version "$VERSION" '.version == $version and .background.scripts == ["bundles/background.js"]'

      - name: Save tested extensions
        uses: actions/upload-artifact@v7
        with:
          name: cose-extensions
          path: ${{ runner.temp }}/packages/*.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-chromium:
    needs: build-and-test
    if: needs.build-and-test.outputs.release_tag != ''
    concurrency:
      group: release-${{ needs.build-and-test.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      firefox_pending: ${{ steps.publish.outputs.firefox_pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cose-extensions
          path: packages

      - name: Publish the Chromium ZIP
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build-and-test.outputs.release_sha }}
        run: bash scripts/publish-extension-release.sh chromium

  sign-firefox:
    needs: [build-and-test, publish-chromium]
    if: needs.publish-chromium.outputs.firefox_pending == 'true'
    concurrency:
      group: firefox-sign-${{ needs.build-and-test.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      xpi_ready: ${{ steps.sign.outputs.xpi_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-test.outputs.release_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: cose-extensions
          path: packages

      - name: Submit or retrieve the Firefox package from Mozilla
        id: sign
        env:
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build-and-test.outputs.release_sha }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "::error::Configure the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets"
            exit 1
          fi
          tag_ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
          target=$(awk -v ref="$tag_ref" '$2 == ref { tag = $1 } $2 == ref "^{}" { commit = $1 } END { print (commit ? commit : tag) }' <<< "$refs")
          if [[ "$target" != "$RELEASE_SHA" ]]; then
            echo "::error::$RELEASE_TAG does not point to the tested commit $RELEASE_SHA"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          tested="packages/cose-$version-firefox.zip"
          signed="packages/cose-$version-firefox.xpi"
          status=0
          node scripts/download-firefox-xpi.mjs "$version" "$signed" || status=$?
          if [[ "$status" == 3 ]]; then
            unzip -q "$tested" -d "$RUNNER_TEMP/firefox-submission"
            git archive --format=zip --output="$RUNNER_TEMP/cose-source.zip" HEAD
            pnpm -C apps/extension exec web-ext sign --channel unlisted \
              --source-dir "$RUNNER_TEMP/firefox-submission" \
              --artifacts-dir "$RUNNER_TEMP/amo-signed" \
              --upload-source-code "$RUNNER_TEMP/cose-source.zip" \
              --timeout 90000 --approval-timeout 0
            status=0
            node scripts/download-firefox-xpi.mjs "$version" "$signed" || status=$?
          fi
          if [[ "$status" == 3 || "$status" == 4 ]]; then
            echo "::notice::Chromium is published. Re-run all jobs after Mozilla approves Firefox."
            echo "Firefox $version is awaiting AMO approval. Re-run all jobs after Mozilla signs it to add the XPI to the existing release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$status" == 0 ]] || exit "$status"
          unzip -tq "$signed"
          unzip -p "$signed" manifest.json |
            jq -e --arg version "$version" '.version == $version and .browser_specific_settings.gecko.id == "cose@doocs.org"'
          unzip -p "$signed" META-INF/mozilla.rsa > "$RUNNER_TEMP/mozilla.rsa"
          test -s "$RUNNER_TEMP/mozilla.rsa"
          unzip -q "$tested" -d "$RUNNER_TEMP/firefox-tested"
          unzip -q "$signed" -d "$RUNNER_TEMP/firefox-signed"
          diff -qr -x META-INF "$RUNNER_TEMP/firefox-tested" "$RUNNER_TEMP/firefox-signed"
          echo "xpi_ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.xpi_ready == 'true'
        with:
          name: cose-firefox-signed
          path: packages/*.xpi
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish-firefox:
    needs: [build-and-test, sign-firefox]
    if: needs.sign-firefox.outputs.xpi_ready == 'true'
    concurrency:
      group: release-${{ needs.build-and-test.outputs.release_tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cose-firefox-signed
          path: packages

      - name: Add the signed Firefox XPI to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-test.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build-and-test.outputs.release_sha }}
        run: bash scripts/publish-extension-release.sh firefox
